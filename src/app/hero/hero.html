<section class="hero" aria-labelledby="hero-title">
    <div class="hero-text">
        <h1 id="hero-title">Collect Feedback,<br> Unlock Ideas</h1>
        <p>Create and share surveys in minutes — from team events to workplace culture. Collect options, engage your audience, and turn feedback into action.</p>
        <button class="button create" type="button" (click)="createSurvey.emit()">New survey</button>
    </div>
    <img class="icon-mobile" src="/icon/mobile-hover.png" alt="" aria-hidden="true" />
    <div class="hero-icons" role="img" aria-label="Icons representing a checkmark, a speech bubble, a star, and a question mark">
    <img class="icon-check" src="/icon/check.svg" alt="" aria-hidden="true" />
    <img class="icon-bubble" src="/icon/typing-bubble.svg" alt="" />
    <img class="icon-star" src="/icon/star.svg" alt="" aria-hidden="true" />
    <img class="icon-question" src="/icon/Questin-mark.svg" alt="" aria-hidden="true" />
    </div>
</section>
