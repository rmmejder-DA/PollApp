<section class="home-section home-section--urgent">
  <h2 class="section-title">Your surveys</h2>
  <div class="cards home-cards">
    @for (poll of polls; track poll.id) {
      <a class="card urgent home-card" [routerLink]="['/survey', poll.id]">
        <small>{{ poll.category }} · {{ daysLeft(poll) }} days left</small>
        <b>{{ poll.title }}</b>
        <span>{{ poll.options.length }} answers</span>
      </a>
    }
  </div>
</section>
