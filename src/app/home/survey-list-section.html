<section id="survey-cards" class="home-section home-section--all">
  @if (polls.length) {
    <div id="survey-grid" class="survey-grid">
      @for (poll of polls; track poll.id; let pollIndex = $index) {
        <a id="survey-card-{{ pollIndex + 1 }}" class="survey-card" [class.survey-card--past]="past" [routerLink]="['/survey', poll.id]">
          <small>{{ poll.category }}</small>
          <b>{{ poll.title }}</b>
          <span class="survey-end">{{ endLabel(poll) }}</span>
        </a>
      }
    </div>
  } @else {
    <p id="empty-surveys" class="home-empty-state">No surveys available.</p>
  }
</section>
