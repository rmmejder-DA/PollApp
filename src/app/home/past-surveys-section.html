<section class="home-section home-section--past">
  <h2 class="section-title">Past surveys</h2>
  <div class="list home-list home-list--past">
    @for (poll of polls; track poll.id) {
      <a class="list-item past home-list-item home-list-item--past" [routerLink]="['/survey', poll.id]">
        <small>{{ poll.category }} · Ended {{ formatDate(poll) }}</small>
        <b>{{ poll.title }}</b>
      </a>
    }
  </div>
</section>
