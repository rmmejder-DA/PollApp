<fieldset id="question-card-{{ questionNumber() }}" class="question-card" [formGroup]="question()">
    <div id="question-heading-{{ questionNumber() }}" class="question-heading">
        <legend>{{ questionNumber() }}. Question</legend>
        <button class="icon-button" type="button" aria-label="Delete question" (click)="removeQuestion.emit()"
            [disabled]="!canRemove()">×</button>
    </div>
    <input class="question-input" formControlName="name" placeholder="Write your question" />
    <div id="answers-heading-{{ questionNumber() }}" class="answers-heading"><strong>Answers</strong><label class="multiple"><input type="checkbox" /> Allow
            multiple answers.</label></div>
    <div id="answers-{{ questionNumber() }}" class="answers" formArrayName="answers">
        @for (answer of answers().controls; track $index) {
        <div id="answer-row-{{ questionNumber() }}-{{ $index + 1 }}" class="answer-row"><span>{{ letter($index) }}.</span>
        <input type="text" [formControlName]="$index"
                [placeholder]="'Answer ' + ($index + 1)" /><button class="icon-button" type="button"
                aria-label="Delete answer" (click)="removeAnswer.emit($index)"
                [disabled]="answers().length <= 2">×</button></div>
        }
    </div>
    <button class="add-answer" type="button" (click)="addAnswer.emit()">Add answer <span>⊕</span></button>
</fieldset>
